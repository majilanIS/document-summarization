# Front-end CI/CD (no Docker: the Next.js app is built and deployed as is).
#
#   CI (every push and pull request touching front-end/): npm ci, lint,
#   production build.
#
#   CD (push to main): deploy to Vercel. Runs only once these repository
#   secrets are set (Settings > Secrets and variables > Actions):
#     VERCEL_TOKEN       - https://vercel.com/account/tokens
#     VERCEL_ORG_ID      - from front-end/.vercel/project.json after
#     VERCEL_PROJECT_ID    running `npx vercel link` in front-end/
#   In the Vercel project settings, set BACKEND_URL to the deployed API.

name: Front-end

on:
  push:
    branches: [main]
    paths:
      - "front-end/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    paths:
      - "front-end/**"
      - ".github/workflows/frontend.yml"
  workflow_dispatch:

concurrency:
  group: frontend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: front-end

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: front-end/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

  deploy:
    name: Deploy to Vercel
    needs: build
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - name: Check Vercel secrets
        id: secrets
        working-directory: .
        run: |
          if [ -n "$VERCEL_TOKEN" ] && [ -n "$VERCEL_ORG_ID" ] && [ -n "$VERCEL_PROJECT_ID" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::Vercel secrets not set, skipping deployment."
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == 'true'

      - uses: actions/setup-node@v4
        if: steps.secrets.outputs.ready == 'true'
        with:
          node-version: 22

      - name: Deploy
        if: steps.secrets.outputs.ready == 'true'
        run: |
          npx --yes vercel@latest pull --yes --environment=production --token="$VERCEL_TOKEN"
          npx --yes vercel@latest build --prod --token="$VERCEL_TOKEN"
          npx --yes vercel@latest deploy --prebuilt --prod --token="$VERCEL_TOKEN"

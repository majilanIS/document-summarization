# Back-end CI/CD.
#
#   CI (every push and pull request touching back-end/):
#     1. test   - install requirements-server.txt + pytest and run the tests
#                 (Gemini is mocked, no local models needed).
#     2. docker - build the image, start a container from it and check
#                 /api/health answers.
#
#   CD (push to main or a v* tag): the image is pushed to the GitHub
#   Container Registry as ghcr.io/<owner>/docs-summarizer-api, tagged
#   latest / sha-<commit> / <version>. Run it with:
#
#     docker run -p 8000:8000 --env-file .env -v docs-data:/app/data \
#       ghcr.io/<owner>/docs-summarizer-api:latest

name: Back-end

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths:
      - "back-end/**"
      - ".github/workflows/backend.yml"
  pull_request:
    paths:
      - "back-end/**"
      - ".github/workflows/backend.yml"
  workflow_dispatch:

concurrency:
  group: backend-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: back-end

env:
  IMAGE_NAME: docs-summarizer-api

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: back-end/requirements-server.txt

      - name: Install dependencies
        run: pip install -r requirements-server.txt pytest httpx

      - name: Run tests
        run: pytest -q

  docker:
    name: Docker image
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Image tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=sha
            type=semver,pattern={{version}}
            type=ref,event=pr

      - name: Build image
        uses: docker/build-push-action@v6
        with:
          context: back-end
          load: true
          tags: ${{ env.IMAGE_NAME }}:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the container
        run: |
          docker run -d --name api -p 8000:8000 ${{ env.IMAGE_NAME }}:ci
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8000/api/health; then
              echo; echo "API is up"; docker rm -f api; exit 0
            fi
            sleep 2
          done
          echo "API did not become healthy"; docker logs api; exit 1

      - name: Log in to GitHub Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Push image
        if: github.event_name != 'pull_request'
        uses: docker/build-push-action@v6
        with:
          context: back-end
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
